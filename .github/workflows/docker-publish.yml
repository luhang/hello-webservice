name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许在 GitHub 页面手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 准备构建器（支持层缓存，构建更快）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 自检：确认 Secrets 真的有值（避免空值导致的模糊报错）
      - name: Verify Docker Hub credentials
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$U" ] || [ -z "$T" ]; then
            echo "::error::DOCKERHUB_USERNAME 或 DOCKERHUB_TOKEN 为空。请检查 Settings > Secrets and variables > Actions，确认它们位于 Repository secrets（不是 Variables），且名称完全一致。"
            exit 1
          fi
          echo "凭据已读取：username=$U，token 长度=${#T}"

      # 4. 登录 Docker Hub（凭据从仓库 Secrets 读取，不明文出现）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 生成标签：latest + main-<commit短hash>
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: coffepop/hello-webservice
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      # 6. 构建并推送
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
